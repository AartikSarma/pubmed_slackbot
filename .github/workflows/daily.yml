name: Daily PubMed Check

on:
  schedule:
    # Run daily at 8 AM UTC (adjust as needed)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allow manual triggering from GitHub UI
    inputs:
      days:
        description: 'Number of days to look back for papers'
        required: false
        default: '7'
        type: string

jobs:
  check-pubmed:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GitHub disables scheduled workflows in repos with no commit activity for
      # 60 days. Push an empty commit once the repo approaches that window so the
      # daily schedule does not silently stop running.
      - name: Keep scheduled workflow alive
        if: github.event_name == 'schedule'
        run: |
          days_since_last_commit=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was ${days_since_last_commit} days ago"
          if [ "${days_since_last_commit}" -ge 45 ]; then
            echo "Pushing an empty commit to reset the 60-day inactivity timer"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflow alive"
            git push
          fi

      - name: Restore posted papers cache
        uses: actions/cache@v4
        with:
          path: posted_papers.json
          key: posted-papers-${{ github.run_id }}
          restore-keys: |
            posted-papers-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PubMed bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PUBMED_API_KEY: ${{ secrets.PUBMED_API_KEY }}
        run: python pubmed_bot.py --days ${{ inputs.days || '7' }}
